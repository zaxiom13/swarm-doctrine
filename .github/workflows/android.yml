name: Android debug build
on:
  pull_request:
    paths: ['android/**', 'src/**', 'public/**', 'index.html', 'connect.html', 'vite.config.ts', 'package*.json', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle -p android lintDebug assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: swarm-doctrine-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Verify renderer recovery callbacks
        run: gradle -p android testDebugUnitTest
      - name: Build installed smoke tests
        run: gradle -p android assembleDebugAndroidTest
      - name: Enable runner KVM
        run: sudo chmod a+rw /dev/kvm
      - name: Installed offline WebView smoke (API 35)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-snapshot -no-audio -no-boot-anim -gpu swiftshader_indirect -camera-back none
          script: |
            bash android/scripts/installed-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: swarm-doctrine-installed-smoke-api35
          path: |
            android/app/build/smoke-evidence/
            android/app/build/outputs/androidTest-results/
            android/app/build/reports/androidTests/
          retention-days: 30
