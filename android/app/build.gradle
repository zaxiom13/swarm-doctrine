import groovy.json.JsonSlurper
import java.util.zip.ZipFile

plugins { id 'com.android.application' }
android {
    namespace 'com.zaxiom.swarmdoctrine'
    compileSdk 35
    buildFeatures { buildConfig true }
    defaultConfig {
        applicationId 'com.zaxiom.swarmdoctrine'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets.main.assets.srcDir layout.buildDirectory.dir('generated/webAssets')
}
dependencies {
    // Align AndroidX's transitive Kotlin stdlib/JDK variants to avoid duplicate classes.
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'androidx.webkit:webkit:1.12.1'
}
// Build from the same source as the website. Do not commit generated bundles.
tasks.register('buildWebAssets', Exec) {
    workingDir rootProject.projectDir.parentFile
    commandLine 'npm', 'run', 'build', '--', '--base=/game/',
        '--outDir=android/app/build/generated/webAssets', '--emptyOutDir'
    inputs.dir '../../src'
    inputs.dir '../../public'
    inputs.files '../../index.html', '../../connect.html', '../../package-lock.json', '../../vite.config.ts'
    outputs.dir layout.buildDirectory.dir('generated/webAssets')
}
tasks.named('preBuild').configure { dependsOn 'buildWebAssets' }

// Fail CI if the installable archive loses an offline-critical file or an
// index/manifest reference points at an asset that was not packaged.
tasks.register('verifyDebugApk') {
    dependsOn 'assembleDebug'
    doLast {
        def apk = layout.buildDirectory.file('outputs/apk/debug/app-debug.apk').get().asFile
        if (!apk.isFile()) throw new GradleException("Debug APK was not produced: ${apk}")
        new ZipFile(apk).withCloseable { zip ->
            def entry = { path -> zip.getEntry("assets/${path}") }
            ['index.html', 'manifest.webmanifest', 'models/offline-policy.json',
             'icons/icon.svg', 'icons/icon-192.png', 'icons/icon-512.png'].each { path ->
                if (!entry(path)) throw new GradleException("Debug APK is missing assets/${path}")
            }

            def index = zip.getInputStream(entry('index.html')).getText('UTF-8')
            def localRefs = (index =~ /(?:src|href)="([^"]+)"/).collect { it[1] as String }
                .findAll { !it.contains('://') && !it.startsWith('#') }
                .collect { it.startsWith('/game/') ? it.substring('/game/'.length()) : it.replaceFirst('^\\./', '') }
            localRefs.each { path ->
                if (!entry(path)) throw new GradleException("index.html references missing assets/${path}")
            }
            if (!localRefs.any { it.endsWith('.js') } || !localRefs.any { it.endsWith('.css') })
                throw new GradleException('index.html must reference packaged JavaScript and CSS')

            def manifest = new JsonSlurper().parse(zip.getInputStream(entry('manifest.webmanifest')))
            manifest.icons.each { icon ->
                def path = String.valueOf(icon.src).replaceFirst('^/game/', '').replaceFirst('^\\./', '')
                if (!entry(path)) throw new GradleException("manifest references missing assets/${path}")
            }
        }
    }
}
