plugins { id 'com.android.application' }

def playRelease = findProperty('playRelease')?.toString() == 'true'
def releaseEnvKeys = ['SD_KEYSTORE', 'SD_KEYSTORE_PASSWORD', 'SD_KEY_ALIAS', 'SD_KEY_PASSWORD']
def hasReleaseKey = releaseEnvKeys.every { System.getenv(it)?.trim() }
if (playRelease && !hasReleaseKey) {
    throw new GradleException('Play release requires SD_KEYSTORE, SD_KEYSTORE_PASSWORD, SD_KEY_ALIAS and SD_KEY_PASSWORD.')
}

android {
    namespace 'com.zaxiom.swarmdoctrine'
    compileSdk 35
    buildFeatures { buildConfig true }

    defaultConfig {
        applicationId 'com.zaxiom.swarmdoctrine'
        minSdk 26
        targetSdk 35
        versionCode (System.getenv('SD_VERSION_CODE')?.trim() ?: '1').toInteger()
        versionName (System.getenv('SD_VERSION_NAME')?.trim() ?: '1.0.0')
    }

    signingConfigs {
        if (hasReleaseKey) {
            release {
                storeFile file(System.getenv('SD_KEYSTORE'))
                storePassword System.getenv('SD_KEYSTORE_PASSWORD')
                keyAlias System.getenv('SD_KEY_ALIAS')
                keyPassword System.getenv('SD_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig hasReleaseKey ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets.main.assets.srcDir layout.buildDirectory.dir('generated/webAssets')
}

dependencies {
    // Align AndroidX's transitive Kotlin stdlib/JDK variants to avoid duplicate classes.
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'androidx.webkit:webkit:1.12.1'
}

def npmCmd = System.getProperty('os.name').toLowerCase().contains('windows') ? 'npm.cmd' : 'npm'

// Build from the same source as the website. Do not commit generated bundles.
tasks.register('buildWebAssets', Exec) {
    workingDir rootProject.projectDir.parentFile
    commandLine npmCmd, 'run', 'build', '--', '--base=/game/',
        '--outDir=android/app/build/generated/webAssets', '--emptyOutDir'
    inputs.dir '../../src'
    inputs.dir '../../public'
    inputs.files '../../index.html', '../../connect.html', '../../package-lock.json', '../../vite.config.ts'
    outputs.dir layout.buildDirectory.dir('generated/webAssets')
}

tasks.named('preBuild').configure { dependsOn 'buildWebAssets' }
