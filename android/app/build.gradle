import groovy.json.JsonSlurper
import java.util.zip.ZipFile
import java.util.zip.ZipEntry
import java.util.zip.ZipOutputStream

plugins { id 'com.android.application' }
android {
    namespace 'com.zaxiom.swarmdoctrine'
    compileSdk 35
    buildFeatures { buildConfig true }
    defaultConfig {
        applicationId 'com.zaxiom.swarmdoctrine'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets.main.assets.srcDir layout.buildDirectory.dir('generated/webAssets')
}
dependencies {
    // Align AndroidX's transitive Kotlin stdlib/JDK variants to avoid duplicate classes.
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'androidx.webkit:webkit:1.12.1'
}
// Build from the same source as the website. Do not commit generated bundles.
tasks.register('buildWebAssets', Exec) {
    workingDir rootProject.projectDir.parentFile
    commandLine 'npm', 'run', 'build', '--', '--base=/game/',
        '--outDir=android/app/build/generated/webAssets', '--emptyOutDir'
    inputs.dir '../../src'
    inputs.dir '../../public'
    inputs.files '../../index.html', '../../connect.html', '../../package-lock.json', '../../vite.config.ts'
    outputs.dir layout.buildDirectory.dir('generated/webAssets')
}
tasks.named('preBuild').configure { dependsOn 'buildWebAssets' }

// Fail CI if the installable archive loses an offline-critical file or an
// index/manifest reference points at an asset that was not packaged.
def verifyWebAssets = { File apk, File generated ->
        if (!apk.isFile()) throw new GradleException("Debug APK was not produced: ${apk}")
        new ZipFile(apk).withCloseable { zip ->
            def entry = { path -> zip.getEntry("assets/${path}") }
            // Index references alone miss lazy imports, workers, guides and model files.
            // Compare the entire generated tree with the installable archive, byte for byte.
            def generatedPaths = fileTree(generated).files.collect { file ->
                def path = generated.toPath().relativize(file.toPath()).toString().replace('\\', '/')
                if (!entry(path)) throw new GradleException("Debug APK is missing generated assets/${path}")
                def packaged = zip.getInputStream(entry(path)).withCloseable { it.bytes }
                if (!Arrays.equals(file.bytes, packaged))
                    throw new GradleException("Debug APK has stale or altered assets/${path}")
                path
            }
            def packagedPaths = zip.entries().findAll { !it.directory && it.name.startsWith('assets/') }
                .collect { it.name.substring('assets/'.length()) }
            def extras = packagedPaths - generatedPaths
            if (extras) throw new GradleException("Debug APK has stale generated assets: ${extras.sort().join(', ')}")

            ['index.html', 'manifest.webmanifest', 'models/offline-policy.json',
             'icons/icon.svg', 'icons/icon-192.png', 'icons/icon-512.png'].each { path ->
                if (!entry(path)) throw new GradleException("Debug APK is missing assets/${path}")
            }

            def index = zip.getInputStream(entry('index.html')).getText('UTF-8')
            def localRefs = (index =~ /(?:src|href)="([^"]+)"/).collect { it[1] as String }
                .findAll { !it.contains('://') && !it.startsWith('#') }
                .collect { it.startsWith('/game/') ? it.substring('/game/'.length()) : it.replaceFirst('^\\./', '') }
            localRefs.each { path ->
                if (!entry(path)) throw new GradleException("index.html references missing assets/${path}")
            }
            if (!localRefs.any { it.endsWith('.js') } || !localRefs.any { it.endsWith('.css') })
                throw new GradleException('index.html must reference packaged JavaScript and CSS')

            def manifest = new JsonSlurper().parse(zip.getInputStream(entry('manifest.webmanifest')))
            manifest.icons.each { icon ->
                def path = String.valueOf(icon.src).replaceFirst('^/game/', '').replaceFirst('^\\./', '')
                if (!entry(path)) throw new GradleException("manifest references missing assets/${path}")
            }
        }
}

// Exercise the same verifier used on the real APK, not a duplicate implementation.
// Tiny synthetic ZIPs deliberately omit/mutate lazy assets and references.
tasks.register('verifyAssetVerifier') {
    doLast {
        def directory = layout.buildDirectory.dir("asset-verifier-fixtures/${UUID.randomUUID()}").get().asFile
        directory.mkdirs()
        def fixture = [
            'index.html': '<script src="/game/assets/main.js"></script><link href="/game/assets/main.css">',
            'manifest.webmanifest': '{"icons":[{"src":"/game/icons/icon.svg"}]}',
            'models/offline-policy.json': '{}',
            'icons/icon.svg': '<svg/>', 'icons/icon-192.png': 'png192', 'icons/icon-512.png': 'png512',
            'assets/main.js': 'import("./lazy.js")', 'assets/main.css': 'body{}',
            'assets/lazy.js': 'export default 1', 'assets/search-worker.js': 'postMessage(1)',
        ]
        def checkFixture = { String name, Map generatedFiles, Map packagedFiles, String failureMessage ->
            def generated = new File(directory, "${name}/generated")
            generatedFiles.each { path, content ->
                def file = new File(generated, path)
                file.parentFile.mkdirs()
                file.setText(content, 'UTF-8')
            }
            def apk = new File(directory, "${name}.apk")
            apk.withOutputStream { output ->
                new ZipOutputStream(output).withCloseable { zip ->
                    packagedFiles.each { path, content ->
                        zip.putNextEntry(new ZipEntry("assets/${path}"))
                        zip.write(content.getBytes('UTF-8'))
                        zip.closeEntry()
                    }
                }
            }
            String observed = null
            try { verifyWebAssets(apk, generated) }
            catch (GradleException failure) { observed = failure.message }
            if (failureMessage == null ? observed != null : !(observed?.contains(failureMessage)))
                throw new GradleException("Verifier fixture ${name}: expected ${failureMessage ?: 'success'}, got ${observed ?: 'success'}")
            logger.lifecycle("PASS asset verifier ${name}: ${observed ?: 'exact match accepted'}")
        }
        checkFixture('exact', fixture, fixture, null)
        checkFixture('missing-lazy', fixture, fixture.findAll { k, v -> k != 'assets/lazy.js' },
            'missing generated assets/assets/lazy.js')
        checkFixture('missing-worker', fixture, fixture.findAll { k, v -> k != 'assets/search-worker.js' },
            'missing generated assets/assets/search-worker.js')
        checkFixture('altered-model', fixture, fixture + ['models/offline-policy.json': '{"stale":true}'],
            'stale or altered assets/models/offline-policy.json')
        checkFixture('obsolete-chunk', fixture, fixture + ['assets/obsolete.js': 'old'],
            'stale generated assets: assets/obsolete.js')
        def noPolicy = fixture.findAll { k, v -> k != 'models/offline-policy.json' }
        checkFixture('missing-required', noPolicy, noPolicy, 'missing assets/models/offline-policy.json')
        def badIndex = fixture + ['index.html': '<script src="/game/assets/absent.js"></script><link href="/game/assets/main.css">']
        checkFixture('broken-index', badIndex, badIndex, 'index.html references missing assets/assets/absent.js')
        def badManifest = fixture + ['manifest.webmanifest': '{"icons":[{"src":"/game/icons/absent.png"}]}']
        checkFixture('broken-manifest', badManifest, badManifest, 'manifest references missing assets/icons/absent.png')
        def noCss = fixture + ['index.html': '<script src="/game/assets/main.js"></script>']
        checkFixture('no-css-reference', noCss, noCss, 'must reference packaged JavaScript and CSS')
    }
}

tasks.register('verifyDebugApk') {
    dependsOn 'assembleDebug', 'verifyAssetVerifier'
    doLast {
        verifyWebAssets(layout.buildDirectory.file('outputs/apk/debug/app-debug.apk').get().asFile,
            layout.buildDirectory.dir('generated/webAssets').get().asFile)
    }
}
