plugins { id 'com.android.application' }
android {
    namespace 'com.zaxiom.swarmdoctrine'
    compileSdk 35
    buildFeatures { buildConfig true }
    testOptions { unitTests.includeAndroidResources = true }
    defaultConfig {
        applicationId 'com.zaxiom.swarmdoctrine'
        minSdk 26
        targetSdk 35
        // CI can build a higher-version smoke APK to exercise Android's real
        // update install path. Normal builds retain the shipped defaults.
        versionCode (project.findProperty('swarmVersionCode') ?: '1') as Integer
        versionName (project.findProperty('swarmVersionName') ?: '0.1.0')
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets.main.assets.srcDir layout.buildDirectory.dir('generated/webAssets')
}
dependencies {
    // Align AndroidX's transitive Kotlin stdlib/JDK variants to avoid duplicate classes.
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'androidx.webkit:webkit:1.12.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.17'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
// Build from the same source as the website. Do not commit generated bundles.
tasks.register('buildWebAssets', Exec) {
    workingDir rootProject.projectDir.parentFile
    commandLine 'npm', 'run', 'build', '--', '--base=/game/',
        '--outDir=android/app/build/generated/webAssets', '--emptyOutDir'
    inputs.dir '../../src'
    inputs.dir '../../public'
    inputs.files '../../index.html', '../../connect.html', '../../package-lock.json', '../../vite.config.ts'
    outputs.dir layout.buildDirectory.dir('generated/webAssets')
}
tasks.named('preBuild').configure { dependsOn 'buildWebAssets' }
